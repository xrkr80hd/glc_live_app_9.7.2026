services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: glc-app-dev
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    ports:
      - "${GLC_DOCKER_PORT:-3000}:3000"
    volumes:
      - .:/app
      - glc_node_modules:/app/node_modules
      - glc_next_cache:/app/.next
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"

volumes:
  glc_node_modules:
  glc_next_cache:
